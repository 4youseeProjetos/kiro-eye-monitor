[project]
name = "kiro-eye-monitor"
version = "0.1.0"
description = "Monitor de consumo de creditos Kiro (conta + sessoes locais do kiro-cli)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
kiro-eye-collect = "kiro_eye_monitor.main:main"

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiro_eye_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
